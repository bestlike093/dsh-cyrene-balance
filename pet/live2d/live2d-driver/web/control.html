<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>遐蝶 · 驱动控制台</title>
<style>
  :root {
    --bg: #14111d;
    --panel: rgba(255, 255, 255, 0.05);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #e9e3f5;
    --muted: #9a91b3;
    --accent: #b9a0ff;
    --accent-soft: rgba(185, 160, 255, 0.16);
    --ok: #8fe3b0;
    --warn: #f4c97a;
    --err: #ff9d9d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(1200px 700px at 15% -10%, #2a2144 0%, var(--bg) 55%);
    color: var(--text);
    font: 13px/1.6 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 18px 10px; border-bottom: 1px solid var(--panel-border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.5px; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px currentColor; }
  #status-text { color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 12px 18px 18px; display: grid; gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 12px; padding: 12px 14px;
  }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--accent); margin: 0 0 8px; letter-spacing: 1px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .path { flex: 1; min-width: 200px; color: var(--muted); font-size: 12px; word-break: break-all; }
  .muted { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.07);
    border: 1px solid var(--panel-border); border-radius: 8px; padding: 5px 11px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  button:hover { background: var(--accent-soft); border-color: rgba(185, 160, 255, 0.45); }
  button.primary { background: var(--accent-soft); border-color: rgba(185, 160, 255, 0.55); color: #efe9ff; }
  button.active { background: rgba(185, 160, 255, 0.32); border-color: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; padding-right: 4px; }
  .chip { padding: 3px 9px; border-radius: 999px; font-size: 12px; }
  .group-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .group-name { width: 76px; color: var(--muted); font-size: 12px; flex-shrink: 0; }
  .cap-line { margin: 3px 0; font-size: 12px; }
  .cap-line b { color: var(--accent); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; color: var(--text); cursor: pointer; }
  input[type="number"], input[type="text"] {
    font: inherit; color: var(--text); background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border); border-radius: 7px; padding: 4px 8px;
  }
  input[type="number"] { width: 74px; }
  footer {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-top: 1px solid var(--panel-border);
  }
  footer .spacer { flex: 1; }
  #toast { font-size: 12px; color: var(--muted); min-height: 18px; }
  #toast.bad { color: var(--err); }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>
    <span id="status-dot"></span>
    <h1>遐蝶 · 驱动控制台</h1>
    <span id="status-text">正在连接…</span>
  </header>

  <main>
    <section class="card">
      <h2>模型</h2>
      <div class="row">
        <span class="path" id="model-dir">—</span>
        <button id="btn-pick">更换模型…</button>
        <button class="primary" id="btn-reload">重新载入</button>
      </div>
      <div class="muted" id="model-meta" style="margin-top:6px">—</div>
    </section>

    <section class="card">
      <h2>能力识别</h2>
      <div id="capability"><span class="muted">等模型载入…</span></div>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="btn-tell">把这份能力告诉她</button>
        <button id="btn-persona">发送自带人设</button>
        <span class="muted">两条都会递进会话，让接手的智能体知道怎么驱动这具身体、按什么人设说话</span>
      </div>
    </section>

    <section class="card">
      <h2>说话</h2>
      <div class="row">
        <input type="text" id="say-text" placeholder="对她说点什么…" maxlength="120" style="flex:1;min-width:220px">
        <button class="primary" id="btn-say">说</button>
      </div>
    </section>

    <section class="card">
      <h2>表情</h2>
      <div class="chips" id="expressions"><span class="muted">等模型载入…</span></div>
    </section>

    <section class="card">
      <h2>情绪</h2>
      <div class="row">
        <button data-mood="angry">生气</button>
        <button data-mood="sad">难过</button>
        <button data-mood="shy">害羞</button>
        <button data-mood="calm">平静</button>
      </div>
    </section>

    <section class="card">
      <h2>动作</h2>
      <div id="motions"><span class="muted">等模型载入…</span></div>
      <div class="row" style="margin-top:8px">
        <button id="btn-stop">停下来</button>
      </div>
    </section>

    <section class="card grid2">
      <div>
        <h2>视线</h2>
        <div class="row">
          <label class="check"><input type="checkbox" id="gaze-follow" checked> 跟随窗口里的鼠标</label>
        </div>
        <div class="row" style="margin-top:6px">
          <button data-gaze="-1,0">往左看</button>
          <button data-gaze="1,0">往右看</button>
          <button data-gaze="0,-0.6">往上看</button>
          <button id="btn-gaze-home">看回来</button>
        </div>
      </div>
      <div>
        <h2>窗口</h2>
        <div class="row" style="margin-bottom:6px">
          <span class="muted">大小</span>
          <input type="range" id="pet-scale" min="60" max="180" step="5" value="100" style="flex:1;min-width:120px">
          <span id="pet-scale-value" class="muted">100%</span>
        </div>
        <div class="row">
          宽 <input type="number" id="pet-w" min="140" max="900" step="10">
          高 <input type="number" id="pet-h" min="200" max="1200" step="10">
          <button id="btn-apply-size">应用</button>
        </div>
        <div class="row" style="margin-top:6px">
          <label class="check"><input type="checkbox" id="topmost" checked> 置顶</label>
          <label class="check"><input type="checkbox" id="pet-visible" checked> 显示桌宠</label>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span id="toast"></span>
    <span class="spacer"></span>
    <button id="btn-doc">打开方法文档</button>
    <button id="btn-quit">退出</button>
  </footer>

  <script type="module" src="control.mjs"></script>
</body>
</html>
