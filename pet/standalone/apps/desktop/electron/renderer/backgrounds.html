<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data: pet-media:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <title>桌宠 · 背景库</title>
    <script src="./theme-boot.js"></script>
    <link rel="stylesheet" href="./theme.css" />
    <script src="./i18n.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        background: var(--pet-bg, #fffafc);
        color: var(--pet-fg, #4a3a42);
        font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
      }
      .b-head {
        flex: 0 0 auto;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 22px 12px;
        border-bottom: 1px solid var(--pet-line, rgba(214, 143, 174, 0.18));
      }
      .b-head h1 { margin: 0; font-size: 18px; letter-spacing: 0.02em; }
      .b-head p { margin: 4px 0 0; font-size: 12px; opacity: 0.68; }
      .b-close {
        border: 0; background: transparent; color: inherit;
        font-size: 22px; line-height: 1; cursor: pointer;
        padding: 2px 6px; border-radius: 8px; opacity: 0.6;
      }
      .b-close:hover { opacity: 1; background: rgba(214, 143, 174, 0.12); }
      .b-tools {
        flex: 0 0 auto;
        display: flex; align-items: center; gap: 8px;
        padding: 12px 22px 8px;
      }
      .b-btn {
        border: 1px solid var(--pet-line, rgba(214, 143, 174, 0.3));
        background: #fff;
        color: inherit;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .b-btn:hover { border-color: var(--pet-accent, #d68fae); }
      .b-btn[disabled] { opacity: 0.45; cursor: default; }
      .b-btn.primary { background: var(--pet-accent, #d68fae); border-color: transparent; color: #fff; }
      .b-status { margin-left: auto; font-size: 12px; opacity: 0.7; min-height: 18px; }
      .b-body {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 8px 22px 24px;
      }
      .b-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
      }
      .b-card {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--pet-line, rgba(214, 143, 174, 0.22));
        background: #fff;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .b-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(166, 104, 132, 0.14);
      }
      .b-card.is-active {
        border-color: var(--pet-accent, #d68fae);
        box-shadow: 0 0 0 2px var(--pet-accent, #d68fae) inset;
      }
      .b-thumb {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
        background: rgba(214, 143, 174, 0.08);
      }
      .b-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 10px;
        font-size: 11px;
        opacity: 0.72;
      }
      .b-badge {
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 1px 8px;
        background: var(--pet-accent, #d68fae);
        color: #fff;
        font-size: 10px;
      }
      .b-remove {
        position: absolute;
        top: 6px; right: 6px;
        width: 24px; height: 24px;
        border: 0; border-radius: 50%;
        background: rgba(40, 20, 30, 0.55);
        color: #fff; font-size: 13px; line-height: 1;
        cursor: pointer; opacity: 0;
        transition: opacity 0.12s ease;
      }
      .b-card:hover .b-remove { opacity: 1; }
      .b-remove:hover { background: rgba(180, 40, 70, 0.85); }
      .b-empty {
        margin: 48px auto 0;
        max-width: 380px;
        text-align: center;
        font-size: 13px;
        line-height: 1.9;
        opacity: 0.7;
      }
      .b-empty strong { display: block; font-size: 15px; opacity: 0.9; margin-bottom: 6px; }
      .b-error {
        margin: 0 22px 10px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(200, 60, 90, 0.1);
        color: #a33a55;
        font-size: 12px;
      }
      .b-slots {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 6px 8px 8px;
      }
      .b-chip {
        border: 1px solid var(--pet-line, rgba(214, 143, 174, 0.3));
        background: transparent;
        color: var(--pet-muted, #8a707c);
        border-radius: 999px;
        font-size: 11px;
        line-height: 1;
        padding: 4px 8px;
        cursor: pointer;
      }
      .b-chip:hover {
        border-color: var(--pet-accent, #d68fae);
        color: var(--pet-fg, #4a3a42);
      }
      .b-chip.is-on {
        background: var(--pet-accent, #d68fae);
        border-color: transparent;
        color: #fff;
      }
      .b-error[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header class="b-head">
      <div>
        <h1>背景库</h1>
        <p id="b-summary">正在读取…</p>
      </div>
      <button type="button" id="b-close" class="b-close" aria-label="关闭">×</button>
    </header>

    <div class="b-tools">
      <button type="button" id="b-import" class="b-btn primary">导入图片</button>
      <button type="button" id="b-clear" class="b-btn">不用背景</button>
      <button type="button" id="b-refresh" class="b-btn">刷新</button>
      <span id="b-status" class="b-status"></span>
    </div>

    <p id="b-error" class="b-error" hidden></p>

    <main class="b-body">
      <div id="b-grid" class="b-grid"></div>
      <div id="b-empty" class="b-empty" hidden>
        <strong>还没有背景图</strong>
        点「导入图片」选一张，再到图下面的按钮里挑放哪儿：聊天窗、设置页、独立页面、DSH 页面、DSH 卡片，各自可以不一样。
      </div>
    </main>

    <script src="./backgrounds.js"></script>
  </body>
</html>
