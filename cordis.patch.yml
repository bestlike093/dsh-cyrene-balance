# dsh-cyrene-pet 组件树：一个大插件，十个可自由关闭的板块。
#
# 拆分蓝图与里程碑：docs/component-split.md。
# 通道统一契约：lib/companion/deliver/channel-contract.mjs。
# 当前主行（dsh-cyrene-pet，即组件蓝图里的 pet-kernel）、pet-memory（M2 已拆出）、
# pet-voice（M4）与 pet-qq（M3）启用，完整能力都在它们身上；其余七行默认禁用，
# 每拆完一个域就把对应行打开、并把主文件里的旧实现删除（拆分红线第 47 条）。
#
# 注意：主行的 id / name 保持与 1.0 时代一致，避免已装 profile 出现双行重复挂载。
- insert:
    - id: dsh-cyrene-pet
      name: dsh-cyrene-pet
    - id: pet-memory
      name: dsh-cyrene-pet/memory
    - id: pet-companion
      name: dsh-cyrene-pet/companion
      disabled: true
    - id: pet-body
      name: dsh-cyrene-pet/body
      disabled: true
    - id: pet-proactive
      name: dsh-cyrene-pet/proactive
      disabled: true
    - id: pet-voice
      name: dsh-cyrene-pet/voice
    - id: pet-qq
      name: dsh-cyrene-pet/qq
    - id: pet-wechat
      name: dsh-cyrene-pet/wechat
      disabled: true
    - id: pet-live
      name: dsh-cyrene-pet/live
      disabled: true
    - id: pet-tools
      name: dsh-cyrene-pet/tools
