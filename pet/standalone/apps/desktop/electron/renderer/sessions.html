<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data: pet-media:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
    <title>桌宠 · 会话</title>
    <script src="./theme-boot.js"></script>
    <link rel="stylesheet" href="./theme.css" />
    <script src="./i18n.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column;
        background: var(--pet-bg, #fffafc);
        color: var(--pet-fg, #4a3a42);
        font: 14px/1.65 "Microsoft YaHei", system-ui, sans-serif;
        overflow: hidden;
      }
      .s-head {
        flex: 0 0 auto;
        display: flex; align-items: flex-start; justify-content: space-between;
        gap: 12px; padding: 18px 22px 10px;
      }
      .s-head h1 { margin: 0; font-size: 18px; }
      .s-head p { margin: 4px 0 0; font-size: 12px; opacity: 0.66; }
      .s-close {
        border: 0; background: transparent; color: inherit;
        font-size: 22px; line-height: 1; cursor: pointer;
        padding: 2px 6px; border-radius: 8px; opacity: 0.6;
      }
      .s-close:hover { opacity: 1; background: rgba(214, 143, 174, 0.12); }
      .s-tabs {
        flex: 0 0 auto;
        display: flex; gap: 6px;
        padding: 0 22px;
        border-bottom: 1px solid var(--pet-line, rgba(214, 143, 174, 0.18));
      }
      .s-tab {
        border: 0; background: transparent; color: inherit;
        padding: 9px 14px 10px; cursor: pointer; font-size: 13px;
        border-bottom: 2px solid transparent; opacity: 0.65;
      }
      .s-tab.is-active {
        opacity: 1; font-weight: 600;
        border-bottom-color: var(--pet-accent, #d68fae);
      }
      .s-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 22px 24px; }
      .s-panel[hidden] { display: none; }
      .s-msg { display: flex; margin-bottom: 10px; }
      .s-msg.user { justify-content: flex-end; }
      .s-bubble {
        max-width: 76%;
        padding: 8px 12px;
        border-radius: 14px;
        background: #fff;
        border: 1px solid var(--pet-line, rgba(214, 143, 174, 0.2));
        white-space: pre-wrap;
        word-break: break-word;
      }
      .s-msg.user .s-bubble {
        background: var(--pet-accent, #d68fae);
        border-color: transparent;
        color: #fff;
      }
      .s-meta {
        display: block; margin-top: 3px;
        font-size: 10px; opacity: 0.55;
      }
      .s-msg.user .s-meta { color: rgba(255, 255, 255, 0.85); opacity: 0.9; }
      .s-qq-status {
        display: flex; flex-wrap: wrap; gap: 8px 14px;
        margin: 0 0 14px; padding: 9px 12px;
        border-radius: 10px;
        background: rgba(214, 143, 174, 0.08);
        font-size: 12px;
      }
      .s-qq-status b { font-weight: 600; }
      .s-peer { margin-bottom: 18px; }
      .s-peer-title {
        font-size: 12px; opacity: 0.7; margin: 0 0 6px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .s-empty {
        margin: 40px auto 0; max-width: 360px;
        text-align: center; font-size: 13px; line-height: 1.9; opacity: 0.68;
      }
      .s-empty strong { display: block; font-size: 15px; opacity: 0.9; margin-bottom: 6px; }
      .s-actions { margin: 10px 0 16px; display: flex; gap: 8px; }
      .s-btn {
        border: 1px solid var(--pet-line, rgba(214, 143, 174, 0.3));
        background: #fff; color: inherit;
        border-radius: 999px; padding: 5px 13px; font-size: 12px; cursor: pointer;
      }
      .s-btn:hover { border-color: var(--pet-accent, #d68fae); }
    </style>
  </head>
  <body>
    <header class="s-head">
      <div>
        <h1>会话</h1>
        <p id="s-summary">聊天历史与 QQ 会话放在一起看</p>
      </div>
      <button type="button" id="s-close" class="s-close" aria-label="关闭">×</button>
    </header>

    <nav class="s-tabs" aria-label="会话分区">
      <button type="button" class="s-tab is-active" data-tab="chat">聊天历史</button>
      <button type="button" class="s-tab" data-tab="qq">QQ 会话</button>
    </nav>

    <main class="s-body">
      <section id="s-panel-chat" class="s-panel">
        <div class="s-actions">
          <button type="button" id="s-refresh-chat" class="s-btn">刷新</button>
        </div>
        <div id="s-chat-list"></div>
        <div id="s-chat-empty" class="s-empty" hidden>
          <strong>还没有聊天记录</strong>
          在主界面气泡或聊天窗说过的话，会出现在这里。
        </div>
      </section>

      <section id="s-panel-qq" class="s-panel" hidden>
        <div id="s-qq-status" class="s-qq-status"></div>
        <div class="s-actions">
          <button type="button" id="s-refresh-qq" class="s-btn">刷新</button>
        </div>
        <div id="s-qq-list"></div>
        <div id="s-qq-empty" class="s-empty" hidden>
          <strong>还没有 QQ 会话</strong>
          在设置里填好 AppID 与密钥、绑定主人之后，这里的最近消息会自己出现。
        </div>
      </section>
    </main>

    <script src="./sessions.js"></script>
  </body>
</html>
